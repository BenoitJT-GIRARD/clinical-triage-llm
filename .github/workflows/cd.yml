name: CD

# Continuous deployment of the demonstration endpoint, which runs on a GPU billed by the minute.
#
# Its normal state is "stopped". The workflow is started by hand, with one of three actions:
#
#   - `verify` deploys, checks, and stops again — the run that proves the chain still works;
#   - `start`  deploys and checks, then leaves the service up for a demonstration;
#   - `stop`   stops it.
#
# Only the repository owner can do any of it. A dispatch is open to accounts with write access
# alone; on top of that, every job that touches the Hub or Modal waits for the owner's approval
# through the `production` environment, which alone holds the tokens, and refuses any other
# actor. A job that has not passed the approval cannot read a token: they live in the
# environment, not in the repository.
#
# Two objects move at different rates here: the API gateway, whose image is rebuilt from the
# commit, and the model, whose version is frozen on the Hugging Face Hub under a `model-v*` tag.
# They meet in the deployment job, which hands Modal the pair (code, model revision): the engine
# reloads the weights from the Hub at that revision, and no image carries four gigabytes.
#
# Every action is referenced by commit rather than by tag. A tag can be moved onto other code,
# and that code would run here with the tokens below.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "verify: deploy, check, stop — start: deploy, check, leave up — stop"
        type: choice
        options: [verify, start, stop]
        default: verify

permissions:
  contents: read
  packages: write

# Two runs never touch Modal at once: their deployments would overwrite each other.
concurrency:
  group: modal-deployment
  cancel-in-progress: false

jobs:
  image:
    name: Publish the gateway image
    if: inputs.action != 'stop'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # GHCR accepts lowercase references only, whereas the repository name keeps the case of
      # the owning account.
      - name: Determine the image name
        id: name
        run: echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/api" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # `sbom` and `provenance` attach to the image the list of what it contains and the
      # attestation of how it was built: the day a vulnerability is published, they answer
      # without rebuilding whether this image contains the package.
      - name: Build and publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: infra/api.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

  model:
    name: Gate and publish the model version
    if: >-
      ${{ inputs.action != 'stop'
          && startsWith(github.ref, 'refs/tags/model-v')
          && github.actor == github.repository_owner }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    outputs:
      revision: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      # The `train` group stays out: gating a version and publishing its cards needs neither
      # torch nor Unsloth. `--locked` fails when `uv.lock` no longer matches `pyproject.toml`.
      - name: Sync the dependencies
        run: uv sync --locked --no-group train

      # The criteria were fixed before the model they judge existed: every answer usable, and never
      # more urgent patients missed than the explicit rule misses. A version that fails them is
      # neither published nor served.
      - name: Release gate
        run: uv run --no-sync python scripts/check_release.py

      # The weights and the dataset are published from the machine that trained them; the runner
      # has neither. What it publishes is what is versioned: the two cards, byte for byte, and the
      # tag that makes the version citable — the revision the engine asks the Hub for.
      - name: Publish the cards and tag the version
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_NAMESPACE: ${{ vars.HF_NAMESPACE }}
        run: uv run --no-sync python scripts/publish_to_hub.py --what cards --tag "$GITHUB_REF_NAME"

  deployment:
    name: Deploy, check, and stop unless asked to stay up
    needs: [image, model]
    # `model` runs on a model tag only: without `always()`, its absence would cancel the
    # deployment of the gateway on its own.
    if: >-
      ${{ always()
          && inputs.action != 'stop'
          && github.actor == github.repository_owner
          && needs.image.result == 'success'
          && needs.model.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      # The whole history, tags included: without it, `git describe` below sees no model tag.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      # The package itself, not only the tooling: `infra/modal_app.py` imports `clinical_triage`
      # at deployment time, so that the remote container receives the service code.
      - name: Sync the dependencies
        run: uv sync --locked --no-group train

      # Modal rebuilds both containers from `infra/modal_app.py`, so the engine is redeployed
      # every time, and its revision cannot be `main`, which moves with every publication. On a
      # model tag it is that tag; on any other commit, the latest `model-v*` tag of the
      # repository — the version already in service.
      - name: Deploy to Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          HF_NAMESPACE: ${{ vars.HF_NAMESPACE }}
          PUBLISHED_REVISION: ${{ needs.model.outputs.revision }}
        run: |
          TRIAGE_MODEL_REVISION="${PUBLISHED_REVISION:-$(git describe --tags --abbrev=0 --match 'model-v*')}"
          echo "Model revision deployed: $TRIAGE_MODEL_REVISION"
          export TRIAGE_MODEL_REVISION
          uv run --no-sync modal deploy infra/modal_app.py

      # A deployment that does not check its result is not a deployment. The engine starts cold:
      # the CUDA image and the weights on a fresh machine, then vLLM — up to six minutes measured.
      # The wait therefore goes up to ten.
      - name: Wait until the engine is ready
        env:
          ENDPOINT: ${{ vars.DEPLOY_ENDPOINT_URL }}
          TRIAGE_API_KEY: ${{ secrets.TRIAGE_API_KEY }}
        run: |
          for attempt in $(seq 1 40); do
            status=$(curl -s -o /dev/null -w '%{http_code}' "$ENDPOINT/ready" -H "X-API-Key: $TRIAGE_API_KEY")
            if [ "$status" = "200" ]; then
              echo "Engine ready."
              exit 0
            fi
            sleep 15
          done
          echo "The engine is not ready ten minutes after deployment."
          exit 1

      # Ready is not enough: the engine must answer what the evaluated model answered.
      - name: Check that the deployed model is the evaluated one
        env:
          ENDPOINT: ${{ vars.DEPLOY_ENDPOINT_URL }}
          TRIAGE_API_KEY: ${{ secrets.TRIAGE_API_KEY }}
        run: uv run --no-sync python scripts/check_deployment.py --url "$ENDPOINT" --key "$TRIAGE_API_KEY"

      # A verification ends stopped, and so does a failed one: a GPU left up by a red run would
      # cost the rest of the month.
      - name: Stop the application
        if: ${{ always() && inputs.action == 'verify' }}
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: uv run --no-sync modal app stop clinical-triage --yes

  stop:
    name: Stop the application
    if: ${{ inputs.action == 'stop' && github.actor == github.repository_owner }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Stop
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: uvx --from "modal==1.5.5" modal app stop clinical-triage --yes
