name: CD

# Continuous deployment. The pipeline separates two objects that move at different rates:
#
#   - the **API gateway**, rebuilt on every push to `main`;
#   - the **model**, whose version is frozen on the Hugging Face Hub when the repository is
#     tagged `model-v*`.
#
# The two meet in the deployment job, which hands the host the pair (image, model revision). The
# inference server reloads the weights from the Hub at the revision asked for: no image has to
# carry three gigabytes. A new model version therefore ships without rebuilding the gateway, and
# the other way round.
#
# Every action is referenced by commit rather than by tag. A tag can be moved onto other code,
# and that code would run here with the secrets below.

on:
  push:
    branches: [main]
    tags: ["v*", "model-v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Publish the gateway image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # GHCR accepts lowercase references only, whereas the repository name keeps the case of
      # the owning account.
      - name: Determine the image name
        id: name
        run: echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/api" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # `sbom` and `provenance` attach to the image the list of what it contains and the
      # attestation of how it was built. That is what makes it possible, the day a vulnerability
      # is published, to answer without rebuilding: does that image contain the package?
      - name: Build and publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: infra/api.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

  model:
    name: Publish the model version
    if: startsWith(github.ref, 'refs/tags/model-v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      revision: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      # The `train` group stays out: publishing a model card needs neither torch nor Unsloth.
      # The commands that follow carry `--no-sync`, without which `uv run` resynchronises with
      # the default groups (`dev` and `train`) and reinstalls what this step has just left out.
      # As in continuous integration, both syncs of this file carry `--locked`: that flag
      # fails when `uv.lock` no longer matches `pyproject.toml`, where `--frozen` merely
      # refrains from updating it and would publish from a stale lock.
      - name: Sync the dependencies
        run: uv sync --locked --no-group train

      # The runner publishes only what it actually has: the **model cards**, which are
      # versioned. Neither the weights nor the training sets are in the repository — the first
      # weigh gigabytes, the second are rebuilt by `scripts/build_dataset.py` and published from
      # the machine that produced them. A runner that tried would send two files of the six and
      # report a success.
      #
      # The tag is the heart of the mechanism: it freezes a citable revision on the Hub, which
      # the inference server will ask for explicitly. Without it, a deployment would point at
      # `main`, which moves at every publication. It is placed on every Hub repository this run
      # touched, the dataset included.
      - name: Publish the model cards and tag the version
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_NAMESPACE: ${{ vars.HF_NAMESPACE }}
        run: uv run --no-sync python scripts/publish_to_hub.py --what cards --tag "$GITHUB_REF_NAME"

      - name: Summarise the published version
        run: |
          echo "### Model version $GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Model cards published, tag $GITHUB_REF_NAME placed on the Hub repositories." >> "$GITHUB_STEP_SUMMARY"
          echo "Weights and datasets: uploaded from the training machine." >> "$GITHUB_STEP_SUMMARY"
          echo "The inference server will load this revision at deployment." >> "$GITHUB_STEP_SUMMARY"

  deployment:
    name: Deploy the endpoint
    needs: [image, model]
    # `model` only runs on a model tag. Without `always()`, its absence alone would cancel the
    # deployment of the gateway on its own.
    if: >-
      ${{ always()
          && vars.DEPLOY_ENABLED == 'true'
          && needs.image.result == 'success'
          && needs.model.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      # The package itself, not only the tooling: `infra/modal_app.py` imports `clinical_triage`
      # at deployment time, so that the remote container receives the service code. The `train`
      # group stays out — the runner trains nothing — and the deployment below carries
      # `--no-sync`: otherwise `uv run` would resynchronise with the default groups, that is
      # several gigabytes of CUDA wheels reinstalled inside a fifteen-minute job that still has
      # a health probe to wait for.
      - name: Sync the dependencies
        run: uv sync --locked --no-group train

      # Modal rebuilds its two containers from `infra/modal_app.py`: the vLLM engine, which
      # reads the weights from the Hub at the revision below, and the FastAPI gateway. Outside a
      # model tag the revision is `main`: only the gateway changes, and the model in place goes
      # on being served.
      #
      # The image published to GHCR by the `image` job is not what Modal deploys — it serves the
      # on-site installation, described in `infra/`. Both paths start from the same service
      # code; the `image` job therefore remains a condition of the deployment, since it compiles
      # and exercises it.
      - name: Deploy to Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          # The account alone: the full identifier is composed in `modal_app.py`, with the same
          # fallback as `config.py`. Interpolated bare, an undefined repository variable arrives
          # empty and gives "/qwen3-1.7b-clinical-triage".
          HF_NAMESPACE: ${{ vars.HF_NAMESPACE }}
          TRIAGE_MODEL_REVISION: ${{ needs.model.outputs.revision || 'main' }}
        run: uv run --no-sync modal deploy infra/modal_app.py

      # A deployment that does not check its result is not a deployment.
      - name: Check the endpoint's health after deployment
        env:
          ENDPOINT: ${{ vars.DEPLOY_ENDPOINT_URL }}
        run: |
          for attempt in $(seq 1 20); do
            if curl -fs "$ENDPOINT/health" | grep -q '"status":"ok"'; then
              echo "Endpoint healthy."
              exit 0
            fi
            sleep 15
          done
          echo "The endpoint does not answer correctly after deployment."
          exit 1
