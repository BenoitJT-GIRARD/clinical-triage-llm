name: CD

# Déploiement continu. Le pipeline distingue deux objets qui évoluent à des
# rythmes différents :
#
#   - la **passerelle API**, reconstruite à chaque poussée sur `main` ;
#   - le **modèle**, dont une version est figée sur le Hugging Face Hub lorsque
#     le dépôt est étiqueté `modele-v*`.
#
# Les deux se rejoignent dans le job de déploiement, qui transmet à l'hébergeur
# le couple (image, révision de modèle). Le serveur d'inférence recharge les
# poids depuis le Hub à la révision demandée : aucune image n'a à embarquer
# trois gigaoctets. Une nouvelle version de modèle se livre donc sans
# reconstruire la passerelle, et inversement.

on:
  push:
    branches: [main]
    tags: ["v*", "modele-v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Publier l'image de la passerelle
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      image: ${{ steps.nom.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      # GHCR n'accepte que des références en minuscules, alors que le nom du
      # dépôt conserve la casse du compte propriétaire.
      - name: Déterminer le nom de l'image
        id: nom
        run: echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/api" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Étiquettes de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.nom.outputs.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # `sbom` et `provenance` joignent à l'image la liste de ce qu'elle contient
      # et l'attestation de la façon dont elle a été construite. C'est ce qui
      # permet, le jour où une vulnérabilité est publiée, de répondre sans
      # reconstruire : cette image-là contient-elle le paquet concerné ?
      - name: Construire et publier
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

  modele:
    name: Publier la version du modèle
    if: startsWith(github.ref, 'refs/tags/modele-v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      revision: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Installer Python 3.12
        run: uv python install 3.12

      # Le groupe `train` reste dehors : publier une carte de modèle ne demande
      # ni torch ni Unsloth. Les commandes qui suivent portent `--no-sync`, sans
      # quoi `uv run` resynchronise avec les groupes par défaut (`dev` et
      # `train`) et réinstalle ce que cette étape vient d'écarter.
      - name: Synchroniser les dépendances
        run: uv sync --frozen --no-group train

      # L'exécuteur ne publie que ce dont il dispose réellement : les **cartes de
      # modèle**, qui sont versionnées. Ni les poids ni les jeux d'entraînement ne
      # sont dans le dépôt — les premiers pèsent des gigaoctets, les seconds sont
      # reconstruits par `scripts/01` et publiés depuis la machine qui les a
      # produits. Publier le dataset d'ici téléverserait deux fichiers sur six et
      # l'annoncerait comme un succès.
      #
      # L'étiquette est le cœur du mécanisme : elle fige une révision citable sur
      # le Hub, que le serveur d'inférence demandera explicitement. Sans elle, un
      # déploiement pointerait sur `main`, qui bouge à chaque publication. Elle est
      # posée sur chaque dépôt du Hub, dataset compris.
      - name: Publier les cartes de modèle et étiqueter la version
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_NAMESPACE: ${{ vars.HF_NAMESPACE }}
        run: uv run --no-sync python scripts/08_publish_hf.py --what cartes --etiquette "$GITHUB_REF_NAME"

      - name: Récapituler la version publiée
        run: |
          echo "### Version de modèle $GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Cartes de modèle publiées, étiquette $GITHUB_REF_NAME posée sur les dépôts du Hub." >> "$GITHUB_STEP_SUMMARY"
          echo "Poids et jeux de données : téléversés depuis la machine d'entraînement." >> "$GITHUB_STEP_SUMMARY"
          echo "Le serveur d'inférence chargera cette révision au déploiement." >> "$GITHUB_STEP_SUMMARY"

  deploiement:
    name: Déployer l'endpoint
    needs: [image, modele]
    # `modele` ne s'exécute que sur une étiquette de modèle. Sans `always()`, son
    # absence suffirait à annuler le déploiement de la passerelle seule.
    if: >-
      ${{ always()
          && vars.DEPLOY_ENABLED == 'true'
          && needs.image.result == 'success'
          && needs.modele.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Installer Python 3.12
        run: uv python install 3.12

      # Le paquet lui-même, pas seulement l'outillage : `deploy/modal_app.py`
      # importe `clinical_triage` au moment du déploiement, pour que le conteneur
      # distant reçoive le code de service. Le groupe `train` reste dehors —
      # l'exécuteur n'entraîne rien — et le déploiement ci-dessous porte
      # `--no-sync` : `uv run` resynchroniserait sinon avec les groupes par
      # défaut, soit plusieurs gigaoctets de roues CUDA réinstallées dans un job
      # plafonné à quinze minutes qui doit encore attendre la sonde de santé.
      - name: Synchroniser les dépendances
        run: uv sync --frozen --no-group train

      # Modal reconstruit ses deux conteneurs à partir de `deploy/modal_app.py` :
      # le moteur vLLM, qui lit les poids sur le Hub à la révision ci-dessous, et
      # la passerelle FastAPI. Hors étiquette de modèle, la révision vaut `main` :
      # seule la passerelle change, le modèle en place reste servi.
      #
      # L'image publiée sur GHCR par le job `image` n'est pas ce que Modal
      # déploie — elle sert l'installation sur site, décrite dans `deploy/`. Les
      # deux chemins partent du même code de service ; le job `image` reste donc
      # une condition du déploiement, puisqu'il le compile et l'éprouve.
      - name: Déployer sur Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          # Le compte seul : l'identifiant complet se compose côté `modal_app.py`,
          # avec le même repli que `config.py`. Interpolée nue, une variable de
          # dépôt non définie arrive vide et donne « /qwen3-1.7b-clinical-triage ».
          HF_NAMESPACE: ${{ vars.HF_NAMESPACE }}
          TRIAGE_MODEL_REVISION: ${{ needs.modele.outputs.revision || 'main' }}
        run: uv run --no-sync modal deploy deploy/modal_app.py

      # Un déploiement qui ne vérifie pas son résultat n'est pas un déploiement.
      - name: Vérifier la santé de l'endpoint après déploiement
        env:
          ENDPOINT: ${{ vars.DEPLOY_ENDPOINT_URL }}
        run: |
          for tentative in $(seq 1 20); do
            if curl -fs "$ENDPOINT/health" | grep -q '"status":"ok"'; then
              echo "Endpoint en bonne santé."
              exit 0
            fi
            sleep 15
          done
          echo "L'endpoint ne répond pas correctement après déploiement."
          exit 1

