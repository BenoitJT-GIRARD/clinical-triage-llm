name: CI

# Continuous quality: style, security, tests and the build of the service image, in a run
# started on request (`workflow_dispatch`).
#
# The training dependencies are deliberately left out (`--no-group train`): no test imports
# torch, and installing them would download 2.5 GB of CUDA libraries on every run. The security
# audit, on the other hand, does cover the whole tree: it reads the lock file rather than the
# installed environment.
#
# Every command run after the sync carries `--no-sync`: without it `uv run` resynchronises the
# environment with the default groups (`dev` and `train`, see `[tool.uv]` in pyproject.toml) and
# immediately reinstalls the group the sync had just left out.
#
# Both syncs carry `--locked` rather than `--frozen`: `--frozen` merely refrains from updating
# `uv.lock`, whereas `--locked` fails when the lock no longer matches `pyproject.toml`. Without
# it, a dependency added to the manifest without running `uv lock` again would go green, and both
# the tests and the audit would run against a stale lock.
#
# Actions are pinned by commit: a tag moves, and a moved tag is code nobody reviewed running
# with this repository's token.

# From 2026-09-18 these fire on request alone; the passing run is kept above.
on:
  workflow_dispatch:

# A run started on a branch cancels the run still in progress on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Style and security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync the dependencies
        run: uv sync --locked --no-group train

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Format
        run: uv run --no-sync ruff format --check .

      # Both analyses read the same configuration, hence the same two project-wide derogations,
      # declared and justified in `[tool.bandit]`: B615 (download from the Hub without a pinned
      # revision) and B311 (pseudo-random generator). Without them bandit exits in error: nine
      # findings in the package and six in the scripts, all of those two families. The remaining
      # derogations are written inline, on the `subprocess` rules: `utils.py` asks git for the
      # repository revision, and `scripts/smoke.py` asks it what the run reproduced.
      - name: Static security analysis
        run: uv run --no-sync bandit -c pyproject.toml -r src/clinical_triage

      # The package and the scripts are two separate trees: `-r src/clinical_triage` does not
      # descend into `scripts/`, which would otherwise go unanalysed.
      - name: Static security analysis of the scripts
        run: uv run --no-sync bandit -c pyproject.toml -r scripts

      # The audit covers the whole tree, training group included, without having to install it:
      # it reads the lock file, not the environment.
      #
      # Two edits before the audit, because pip-audit queries PyPI:
      #   - torch's local suffix (`+cu130`) designates the same source as the version published
      #     on PyPI, but does not exist as a number on the index: without removing it, torch
      #     would escape the audit entirely;
      #   - the two spaCy models are data wheels served from a frozen GitHub release, and cannot
      #     be found on PyPI. `spacy`, which carries the code, stays audited.
      # `--strict` therefore keeps its meaning: any *other* unauditable dependency fails the
      # build.
      - name: Known vulnerabilities in the dependencies
        run: |
          uv export --frozen --no-hashes --no-emit-project --all-groups \
            --format requirements-txt -o locked-dependencies.txt
          grep -v 'spacy-models/releases' locked-dependencies.txt \
            | sed -E 's/\+cu[0-9]+$//' > audited-dependencies.txt
          # Two exceptions, both outside the service image — the one that goes to production:
          # it contains neither datasets nor fsspec, and its own audit below carries no
          # derogation. Both are held back by the one ceiling the training stack still imposes,
          # and neither is reachable in this project:
          #
          #   PYSEC-2026-3716  datasets — directory traversal in the *folder-based* dataset
          #     builders. This project loads local JSONL and Hub repositories, never a folder
          #     with metadata.
          #   CVE-2026-104851  fsspec   — template injection in `ReferenceFileSystem`, which reads
          #     Kerchunk reference documents. The project never opens one; fsspec is here for
          #     `datasets` alone, which caps it.
          #
          # To be reconsidered at every Unsloth upgrade: its ceiling on `datasets` (< 5.0) is the
          # only reason these fixes stay out of reach.
          uv run --no-sync pip-audit --strict -r audited-dependencies.txt \
            --ignore-vuln PYSEC-2026-3716 \
            --ignore-vuln CVE-2026-104851

      # The deployed image does not install the lock file but its own pinned list: without this
      # second audit, what actually runs in production would be the one thing left unchecked.
      # Every entry there spans several lines, its digests included: the two spaCy models are
      # dropped as whole entries, for the reason given above. The list pins every package, so
      # it is audited as it stands, without being installed.
      - name: Known vulnerabilities in the image dependencies
        run: |
          uv run --no-sync python -c "
          import pathlib, re
          entries = re.split(r'\n(?=[a-zA-Z])', pathlib.Path('infra/requirements-api.txt').read_text())
          kept = [entry for entry in entries if 'spacy-models/releases' not in entry]
          pathlib.Path('audited-image.txt').write_text('\n'.join(kept))
          "
          uv run --no-sync pip-audit --strict --disable-pip -r audited-image.txt

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync the dependencies
        run: uv sync --locked --no-group train

      - name: Tests and coverage
        run: uv run --no-sync pytest

      # The Hub cards are published byte for byte, and every figure in them is read from the
      # committed results: a card that no longer matches them would publish stale numbers.
      - name: Hub cards up to date with the results
        run: uv run --no-sync python scripts/build_hub_cards.py --check

  image:
    name: Service image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build the gateway image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: infra/api.Dockerfile
          push: false
          load: true
          tags: clinical-triage-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # An image that does not start is not an image, and an authentication nobody tested is not
      # one either. The vLLM engine is absent from a CI run: the gateway must say it lives, and
      # its readiness probe must answer 503 to a key holder and 401 to anyone else.
      - name: Check that the service starts, answers, and refuses a call without a key
        run: |
          docker run -d --name triage-api -p 8080:8080 \
            -e TRIAGE_API_KEY=ci-test-key \
            -e TRIAGE_VLLM_URL=http://127.0.0.1:9 \
            clinical-triage-api:ci
          for attempt in $(seq 1 40); do
            if curl -fs http://localhost:8080/health > health.json; then break; fi
            sleep 3
          done
          cat health.json
          grep -q '"status":"alive"' health.json

          ready=$(curl -s -o ready.json -w '%{http_code}' http://localhost:8080/ready -H 'X-API-Key: ci-test-key')
          cat ready.json
          test "$ready" = "503"
          grep -q '"status":"degraded"' ready.json
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/ready)" = "401"

          without_key=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/triage \
            -H 'Content-Type: application/json' -d '{"symptoms":"douleur thoracique"}')
          test "$without_key" = "401"

          questionnaire=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/questionnaire/next \
            -H 'Content-Type: application/json' -H 'X-API-Key: ci-test-key' \
            -d '{"chief_complaint":"mal de gorge"}')
          test "$questionnaire" = "200"

          docker logs triage-api
          docker rm -f triage-api
