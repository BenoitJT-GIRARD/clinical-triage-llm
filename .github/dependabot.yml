# Mises a jour de dependances proposees automatiquement, en demandes de fusion
# que la CI valide avant toute integration.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"

  - package-ecosystem: "docker"
    directory: "/deploy"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "deploy"
