# Dependency updates proposed automatically, as pull requests that continuous integration
# validates before anything is merged.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"

  - package-ecosystem: "docker"
    directory: "/infra"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "infra"
