# Verifications executees avant chaque commit.
# Installation : uv run pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
      - id: check-added-large-files
        # Le plus gros fichier versionne est le rapport en PDF, quelques
        # megaoctets. Les poids de modeles et les jeux d'entrainement sont hors
        # du depot, publies sur le Hugging Face Hub : ce seuil est la pour que
        # l'un d'eux ne s'y glisse pas par megarde.
        args: ["--maxkb=5120"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix"]
      - id: ruff-format

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml", "-r", "src/clinical_triage"]
        additional_dependencies: ["bandit[toml]"]
