# Checks run before every commit.
# Installation: uv run pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
      - id: check-added-large-files
        # The largest tracked file is a figure, a few hundred kilobytes. Model weights and
        # training sets live outside the repository, published on the Hugging Face Hub: this
        # threshold is here so that one of them cannot slip in unnoticed.
        args: ["--maxkb=5120"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix"]
      - id: ruff-format

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        # The same two perimeters continuous integration analyses. Scanning the package alone
        # would leave the scripts — which read tokens and run subprocesses — unexamined until
        # the workflow ran.
        args: ["-c", "pyproject.toml", "-r", "src/clinical_triage", "scripts"]
        additional_dependencies: ["bandit[toml]"]
