# The full demonstration stack: vLLM inference server and API gateway.
#
# Requirements: a host with an NVIDIA GPU and nvidia-container-toolkit, and the merged model
# produced by scripts/merge_adapter.py --adapter dpo.
#
#   export TRIAGE_API_KEY="a-key-of-your-choosing"
#   docker compose -f infra/docker-compose.yml up --build
#
# The gateway waits for vLLM to declare itself healthy before starting: without that condition
# the first requests fail while the weights load, and the gateway's own probe would be green
# while inference is not answering yet.

services:
  vllm:
    # Version pinned by digest: a `latest`, and even a moving tag, would change the inference
    # engine without notice under a given model and API contract.
    #
    # Overridable for one reason, documented in infra/README.md: vLLM's V1 engine requires
    # CUDA's unified virtual addressing, which WSL 2 does not provide. On a Windows workstation
    # it stops on "UVA is not available" and the health probe fails without saying why. On a
    # Linux host — the deployment one — the pinned version works.
    image: ${TRIAGE_VLLM_IMAGE:-vllm/vllm-openai:v0.29.0@sha256:c2914767605584b6d8f45686b82de173ecc99e781897aa3d0a66dacd72c51ae1}
    command:
      - --model=/models/qwen3-1.7b-triage-dpo-merged
      - --served-model-name=qwen3-1.7b-clinical-triage
      - --max-model-len=1024
      - --dtype=bfloat16
      - --gpu-memory-utilization=0.85
    volumes:
      # The models folder, on the host side. Configurable because it does not live in the same
      # place on every machine: next to the repository in development, on a dedicated volume in
      # production. On a workstation whose repository is synchronised to the cloud it has to
      # live outside it: Docker Desktop cannot mount a synchronisation virtual disk, and the
      # container then starts without seeing the weights.
      - ${TRIAGE_MODELS_DIR:-../var/models}:/models:ro
    ports:
      # Loopback only. The engine has neither an API key nor a quota: the gateway is what
      # authenticates, traces and anonymises, and it reaches the engine over the stack's
      # internal network. Published on 0.0.0.0, the engine offered free, untraced inference to
      # whoever found the port — and since Docker inserts its rules before the host firewall's,
      # closing that port was not enough. The benchmark, run from the host, still reaches it.
      #
      # The host-side port is configurable: 8000 is a common port, and another stack already
      # running on the machine would otherwise prevent startup. The internal port does not move:
      # it is the one the gateway calls over the stack's network, and it does not depend on the
      # host.
      - "127.0.0.1:${TRIAGE_VLLM_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 180s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  api:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    environment:
      TRIAGE_BACKEND: vllm
      TRIAGE_VLLM_URL: http://vllm:8000
      TRIAGE_VLLM_MODEL: qwen3-1.7b-clinical-triage
      TRIAGE_MODEL_VERSION: qwen3-1.7b-clinical-triage
      TRIAGE_AUDIT_LOG: /app/var/logs/audit_triage.jsonl
      # Quota per caller. Sixty a minute matches a reception desk; a load bench, on the other
      # hand, holds a single key and passes that count from its first concurrency level. It
      # raises the quota for the duration of the measurement, without changing the service
      # value.
      TRIAGE_RATE_LIMIT: "${TRIAGE_RATE_LIMIT:-60}"
      # No default value: the service refuses to start without a key.
      TRIAGE_API_KEY: ${TRIAGE_API_KEY:?set TRIAGE_API_KEY before starting the stack}
    volumes:
      # The audit log must outlive the container: traceability of the decisions is a business
      # requirement, not a working file.
      #
      # A named volume rather than a host folder: Docker initialises it with the owner of the
      # image's directory, that is the unprivileged user running the service. A host folder
      # arrives mounted as root, and every request then failed writing the log — after having
      # produced its decision.
      - audit:/app/var/logs
    ports:
      - "${TRIAGE_API_PORT:-8080}:8080"
    restart: unless-stopped
    depends_on:
      vllm:
        condition: service_healthy

volumes:
  # `docker compose cp api:/app/var/logs/audit_triage.jsonl .` takes a copy out;
  # `docker compose down` without `-v` keeps it.
  audit:
