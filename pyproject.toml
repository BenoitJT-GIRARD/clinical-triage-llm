[project]
name = "clinical-triage"
version = "1.0.0"
description = "Emergency-department triage assistant: a Qwen3-1.7B supervised fine-tuned with LoRA then preference-aligned with DPO, served by a FastAPI gateway in front of vLLM"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Benoît J. T. GIRARD", email = "53222414+BenoitJT-GIRARD@users.noreply.github.com" }]
keywords = ["llm", "fine-tuning", "lora", "dpo", "triage", "healthcare"]

# Dependencies of the service and of the data chain. What it takes to build the
# dataset, evaluate a model, serve the API and draw the figures. Training itself
# lives in the `train` group: the service gateway has no need of torch, and putting
# it here would install 2.5 GB of CUDA on every continuous-integration run.
dependencies = [
    # --- Data ---
    # Upper bound imposed by Unsloth (`datasets<4.4.0`), which supplies the training
    # kernels. PYSEC-2026-3716, in versions below 5.0.1, affects the folder-based
    # dataset builders, which this project never uses: it reads local JSONL and Hub
    # repositories. The exception is recorded in the CI audit.
    "datasets>=4.2,<4.4",
    "numpy>=1.26,<2.2",
    # `datasets` pulls pandas in. The upper bound avoids version 3.0.4, withdrawn
    # from the index by its authors over crashes on dates.
    "pandas>=2.2,<3",
    # --- GDPR anonymisation ---
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "spacy>=3.7,<3.9",
    # spaCy models Presidio requires, installed from their official wheel.
    "fr-core-news-md",
    "en-core-web-sm",
    # --- Published figures ---
    "matplotlib>=3.9",
    # --- The ordinary baseline of the evaluation ---
    # A linear classifier over n-grams, trained on the same pairs as the model, says
    # what fine-tuning is worth against an ordinary approach. Without that baseline
    # the evaluation compares the model to trivial references alone, and can conclude
    # nothing about what fine-tuning bought.
    "scikit-learn>=1.5",
    # --- Local configuration ---
    # Reads the `.env` file. Already pulled in by `uvicorn[standard]`, but the
    # package imports it directly: a dependency you use, you declare.
    "python-dotenv>=1.0",
    # --- Inference service ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "httpx>=0.28",
]

# vLLM is not declared as a dependency: the inference server runs in its official
# image (see infra/docker-compose.yml). Adding it here would also freeze the
# project's torch and transformers versions to the ones vLLM imposes.

[project.scripts]
clinical-triage = "clinical_triage.cli:main"

[project.urls]
Repository = "https://github.com/BenoitJT-GIRARD/clinical-triage"

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[dependency-groups]
# Fine-tuning and alignment. Installed by default in development; continuous
# integration does without it, through `uv sync --no-group train`.
train = [
    "torch>=2.12,<2.13",
    # Unsloth supplies the project's LoRA fine-tuning kernels. It is what fixes the
    # bounds on `transformers` and `trl`: it rewrites internal functions of both
    # libraries, and a version it does not know about shows up as an import failure,
    # not as a silent degradation. `datasets`, on the other hand, stays at the fixed
    # version: Unsloth depends on it through a lower bound only, and the 4.3 it would
    # accept carries a directory-traversal flaw.
    "unsloth>=2026.9",
    "transformers>=4.57,<=5.5",
    "trl>=0.23,<=0.24",
    "accelerate>=1.15",
    "peft>=0.21",
    "sentencepiece>=0.2",
    "protobuf>=5",
    "huggingface-hub>=0.27",
    "mlflow>=3.5",
]

dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    # Floor aligned with the version pinned in `.pre-commit-config.yaml`: two major
    # versions apart are two different linters, and the developer would pass what
    # continuous integration refuses right after.
    "ruff>=0.16.7",
    "bandit[toml]>=1.8",
    # Independent check of the exact intervals: the package computes its bound by
    # bisection on the cumulative binomial, and the test compares it with the
    # closed-form beta quantile. scipy arrives with scikit-learn anyway — a dependency
    # you use, you declare, transitive or not.
    "scipy>=1.14",
    # Rendering of the chat template, which the tokenizer applies at training time. The
    # test renders it directly and compares it with `format_chatml`, so that the two
    # cannot drift. It arrives with the notebook tooling anyway; declared here because a
    # test imports it by name.
    "jinja2>=3.1",
    "pip-audit>=2.7",
    "pre-commit>=4.0",
    "ipykernel>=6.29",
    "jupyter>=1.1",
    "nbformat>=5.10",
    "nbconvert>=7.16",
    "reportlab>=4.2",
    "python-pptx>=1.0",
    # Deployment client for the demonstration endpoint (infra/modal_app.py).
    "modal>=1.0",
]

[tool.uv]
default-groups = ["dev", "train"]

# --- PyTorch CUDA 13.0 index (RTX 4060 Ti) and spaCy models ---
[tool.uv.sources]
torch = { index = "pytorch-cu130" }
fr-core-news-md = { url = "https://github.com/explosion/spacy-models/releases/download/fr_core_news_md-3.8.0/fr_core_news_md-3.8.0-py3-none-any.whl" }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
# No exclusion. An exclusion pattern applies to every folder of that name, at any
# depth: excluding `data` would also drop the package's own `data/` folder — clinical
# catalogue, triage rule, vital-sign constants and anonymisation — and the analysis
# would go green without having read the heart of the project.

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "C4", "SIM"]
# E501: line length is the formatter's business.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
addopts = "-ra -q --strict-markers --cov --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=70"
testpaths = ["tests"]
pythonpath = ["src"]
# The folder says the scope, the marker says the intent, and the two cross: a `claim`
# can be a unit test as readily as a system one. `--strict-markers` closes the
# vocabulary — a misspelt marker becomes a collection error instead of a filter that
# selects nothing.
markers = [
    "integration: assembles several modules in this process, without leaving the machine",
    "system: starts the product in its own process and talks to it over the network",
    "claim: fails as soon as a published figure stops matching the code",
    "simulation: replays a simulated run rather than a real measurement",
    "slow: takes more than a second, typically by starting a process or an engine",
]
# A warning nobody reads is a defect waiting: they are all errors here. The one
# exception is Starlette's notice, which asks for `httpx2` for its test client. It is
# raised when that client is imported, the project does not choose the client — it
# comes with FastAPI — and the service itself calls `httpx` directly, outside any test
# client. Nothing in this repository can lift the condition; a FastAPI upgrade will.
filterwarnings = [
    "error",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.coverage.run]
# All the tracked Python, not the package alone: `scripts/` carries the chain end to
# end and `infra/` the deployment descriptor, and both are covered by tests.
source = ["src/clinical_triage", "scripts", "infra"]
# These modules need a GPU: they are verified by real runs of the training pipeline,
# not by unit tests. The files are named one by one rather than by a pattern over the
# training/ group, which would also exempt experiment tracking and the warm-up step
# computation — two modules of pure Python that the tests do cover.
#
# The four training scripts are exempt for the same reason, and for that reason alone:
# they load the weights onto the GPU from their first useful line. The other long
# scripts — dataset build, evaluation, latency bench — stay measured although no test
# covers them: they need the Hub or a served endpoint, not a card, and their 0% has to
# be visible.
omit = [
    "*/training/sft.py",
    "*/training/dpo.py",
    "*/inference.py",
    "*/bootstrap.py",
    "scripts/train_sft.py",
    "scripts/train_dpo.py",
    "scripts/tune_hyperparameters.py",
    "scripts/merge_adapter.py",
]

# The coverage report is published: the header badge reads its line rate, and a rate nobody
# can open is a number nobody can check. It is rewritten by every local run, so it describes
# the suite as it stands rather than the day it was last thought about.
[tool.coverage.xml]
output = "reports/coverage/coverage.xml"

[tool.bandit]
exclude_dirs = [".venv", "tests"]
# These two derogations apply to everything bandit analyses: the package and the
# scripts, the two perimeters continuous integration passes it on the command line.
# They remove nine findings in the package and six in the scripts; without them the
# analysis exits in error in both cases.
#
# B615 flags every download from the Hugging Face Hub without a pinned revision.
# Eleven calls are concerned, of three kinds:
#   - `load_dataset("json", data_files=...)` in `training/sft.py` and
#     `training/dpo.py` does not touch the Hub: it is the local file reader,
#     called on the JSONL that `scripts/build_dataset.py` has just written;
#   - the `from_pretrained` calls on a local path -- the adapter and the merged
#     model in `scripts/merge_adapter.py`, the served weights in `inference.py` --
#     read back what the repository produced;
#   - the real downloads do name a public repository without a revision number:
#     the base model `Qwen/Qwen3-1.7B-Base` in `scripts/build_dataset.py` and
#     `scripts/merge_adapter.py`, and the five medical corpora of `DATA.corpora`
#     in `data/corpus_sources.py`. The identifiers are fixed in `config.py`, a
#     revision is not. Those calls happen only when building the dataset and when
#     training, on the development machine; the service image never runs them, and
#     what goes to production is a revision frozen by tag (see
#     `.github/workflows/cd.yml`).
# B311 flags the use of `random`. The four calls concerned build a `random.Random`
# seeded explicitly, to shuffle and sample datasets reproducibly, never to produce
# a secret. The only secrets of this project are compared with
# `secrets.compare_digest`.
skips = ["B615", "B311"]
